name: Deploy price lookup Worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-stock-watch-prices
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test test/index.test.mjs
      - name: Validate required secrets
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          node --input-type=module -e 'for(const k of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","ALPACA_KEY","ALPACA_SECRET"])if(!process.env[k]){console.error("Missing Actions secret: "+k);process.exitCode=1;}'
      - name: Deploy Worker
        run: npx --yes wrangler@4.36.0 deploy | tee "$RUNNER_TEMP/stock-watch-deploy.log"
      - name: Install provider secrets server-side
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: node -e 'process.stdout.write(JSON.stringify({ALPACA_KEY:process.env.ALPACA_KEY,ALPACA_SECRET:process.env.ALPACA_SECRET}))' | npx --yes wrangler@4.36.0 secret bulk
      - name: Verify health and AAPL data
        run: |
          ENDPOINT=$(grep -Eo 'https://stock-watch-prices\.[a-zA-Z0-9-]+\.workers\.dev' "$RUNNER_TEMP/stock-watch-deploy.log" | head -n 1)
          test -n "$ENDPOINT"
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "$ENDPOINT/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$ENDPOINT/v1/stock?symbol=AAPL" -o "$RUNNER_TEMP/aapl.json"
          PRICE_TEST_FILE="$RUNNER_TEMP/aapl.json" node --input-type=module -e 'import fs from "node:fs";const d=JSON.parse(fs.readFileSync(process.env.PRICE_TEST_FILE,"utf8"));if(d.symbol!=="AAPL"||!d.history?.length||!Number.isFinite(d.price)||!d.time||d.alertsActive!==false)process.exit(1);console.log("AAPL bars:",d.history.length,"Observation:",d.time);'
          printf '### Price Worker deployed and AAPL verified\n\nEndpoint: `%s`\n\nDashboard integration remains a separate step. Alerts unchanged.\n' "$ENDPOINT" >> "$GITHUB_STEP_SUMMARY"
