name: Dashboard regression tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'tests/dashboard/**', '.github/workflows/dashboard-tests.yml']
  pull_request:
    branches: [main]
    paths: ['site/**', 'tests/dashboard/**', '.github/workflows/dashboard-tests.yml']
permissions:
  contents: read
concurrency:
  group: dashboard-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/dashboard
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run isolated browser tests
        env:
          CI: 'true'
        run: npm test
      - name: Upload synthetic-data test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-regression-report
          path: |
            tests/dashboard/playwright-report/
            tests/dashboard/test-results/
          retention-days: 7
          if-no-files-found: ignore
