<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Stock Watch</title><style>body{font:16px system-ui;background:#101827;color:#edf2fa;max-width:960px;margin:auto;padding:24px}article{background:#1d2a3d;border-radius:12px;padding:20px;margin:12px 0}small{color:#b5c4da}svg{width:100%;height:130px}</style><h1>Space Stock Watch</h1><p>USD · delayed consolidated data · review alerts, not automatic trading</p><p id="health">Loading monitor status…</p><main id="cards"></main><script>
function add(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n;}
async function load(){try{const r=await fetch('./data.json?t='+Date.now());if(!r.ok)throw Error('No published monitor data yet');const d=await r.json();document.querySelector('#health').textContent='Updated '+d.updated+' · '+d.status+' · Email '+d.email+' · WhatsApp '+d.whatsapp;const root=document.querySelector('#cards');root.replaceChildren();for(const s of d.stocks){const a=add('article','',root);add('h2',s.symbol+' · target $'+s.target,a);add('p',s.price?'Delayed close $'+s.price+' · '+((s.price/s.target-1)*100).toFixed(1)+'% versus target':'Awaiting validated data',a);add('small',s.time?'Market timestamp '+s.time:s.status,a);const bars=s.history||[];if(bars.length){const v=bars.map(b=>b.c),lo=Math.min(...v),hi=Math.max(...v);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 600 130');const line=document.createElementNS(svg.namespaceURI,'polyline');line.setAttribute('points',v.map((x,i)=>`${i*600/Math.max(v.length-1,1)},${120-(x-lo)*110/Math.max(hi-lo,.01)}`).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#72e0c0');line.setAttribute('stroke-width','2');svg.append(line);a.append(svg);add('p','Available history '+bars[0].t.slice(0,10)+' to '+bars[bars.length-1].t.slice(0,10)+' · lowest daily low $'+Math.min(...bars.map(b=>b.l)).toFixed(2),a);}}}catch(e){document.querySelector('#health').textContent=e.message;}}load();setInterval(load,60000);
</script></html>
